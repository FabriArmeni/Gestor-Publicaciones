<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicaciones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main>
    <h1>Gestor de Publicaciones</h1>    
    <form id="pedido" action="/publicaciones" method="post">
      <label>Título <input name="titulo" minlength="5" maxlength="80" required></label>
      <label>Descripción <textarea name="descripcion" minlength="20" maxlength="500" required></textarea></label>
      <label>Autor <input name="autor" required></label>
      <label>Categoría
        <select name="categoria" required>
          <option value="general">General</option>
          <option value="aviso">Aviso</option>
          <option value="evento">Evento</option>
          <option value="compraventa">Compra-venta</option>
        </select>
      </label>
      <button>Publicar</button>
    </form>
    <p id="salida"></p>
    <section id="lista-publicaciones"></section>

    <section id="diagnostico-formatos">
        <h2>Diagnóstico de formatos</h2>
        <button type="button" id="ver-json">Ver JSON</button>
        <button type="button" id="ver-xml">Ver XML</button>
        <pre id="texto"></pre>
        <ul id="lista-diagnostico"></ul>
    </section>

  </main>
  <script type="module" src="js/app.js"></script>
</body>

</html>
